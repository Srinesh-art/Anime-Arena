services:
  - type: web
    name: anime-arena-server
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm run start --workspace=@anime-arena/server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: SQLITE_PATH
        value: /var/data/anime_arena.db
      - key: CLIENT_ORIGIN
        sync: false
    disk:
      name: anime-arena-data
      mountPath: /var/data
      sizeGB: 1
